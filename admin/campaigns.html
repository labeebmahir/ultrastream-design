<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Campaigns – UltraStream admin prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin">
    <aside class="side">
      <span class="logo">Ultra<span>Stream</span></span>
      <a class="side__link side__link--on" href="campaigns.html">Campaigns</a>
      <div class="side__other">Existing admin sections go here</div>
    </aside>
    <main class="main">
      <div class="head">
        <h1>Campaigns</h1>
        <a class="btn btn--primary" href="campaign-new.html">Create campaign</a>
      </div>
      <p class="sub">Campaigns publish on their start date and stop when their package ends. A live campaign can't be stopped early.</p>
      <div id="groups"></div>
    </main>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/proto-bar.js"></script>
  <script>
    const newId = new URLSearchParams(location.search).get("new");
    const GROUPS = [
      { key: "scheduled", title: "Scheduled", empty: "No scheduled campaigns." },
      { key: "live", title: "Live", empty: "No live campaigns." },
      { key: "ended", title: "Ended", empty: "No ended campaigns yet." },
    ];

    function startsIn(c) {
      const days = Math.ceil((US.toDate(c.start) - US.now()) / 86400000);
      return days <= 1 ? "Starts tomorrow" : `Starts in ${days} days`;
    }

    function endsIn(c) {
      const days = Math.ceil((US.endDate(c) - US.now()) / 86400000);
      return days <= 1 ? "Last day" : `${days} days left`;
    }

    function row(c, key) {
      const m = US.metrics(c);
      const results = key === "scheduled"
        ? `<td class="num">–</td><td class="num">–</td><td class="num">–</td>`
        : `<td class="num">${US.fmtNum(m.impressions)}</td><td class="num">${US.fmtNum(m.clicks)}</td><td class="num">${US.fmtPct(m.ctr)}</td>`;
      const last = key === "ended"
        ? `<a class="btn btn--sm" href="report.html?id=${c.id}">Report</a>`
        : `<span class="cell-sub">${key === "live" ? endsIn(c) : startsIn(c)}</span>`;
      return `<tr class="${c.id === newId ? "is-new" : ""}">
        <td><img class="thumb" src="${US.creativeSrc(c)}" alt=""></td>
        <td><div class="cell-strong">${US.esc(c.advertiser)}</div><div class="cell-sub">${US.esc(US.packageName(c))}</div></td>
        <td style="white-space:nowrap">${US.period(c)}</td>
        <td class="num">${US.fmtMoney(US.cost(c))}</td>
        ${results}
        <td style="white-space:nowrap">${last}</td>
      </tr>`;
    }

    function render() {
      const sorted = [...US.campaigns()].sort((a, b) => b.start.localeCompare(a.start));
      document.getElementById("groups").innerHTML = GROUPS.map(({ key, title, empty }) => {
        const list = sorted.filter((c) => US.status(c) === key);
        return `<section class="group">
          <h2 class="group__title"><span class="dot dot--${key}"></span>${title} <span class="tag">${list.length}</span></h2>
          ${list.length ? `<div class="table-wrap"><table>
            <thead><tr><th>Creative</th><th>Advertiser and package</th><th>Period</th><th class="num">Cost</th><th class="num">Impressions</th><th class="num">Clicks</th><th class="num">CTR</th><th></th></tr></thead>
            <tbody>${list.map((c) => row(c, key)).join("")}</tbody>
          </table></div>` : `<div class="empty">${empty}</div>`}
        </section>`;
      }).join("");
    }

    render();
    document.addEventListener("us:change", render);
    if (newId && US.campaign(newId)) US.toast(`Campaign scheduled for ${US.fmtDate(US.toDate(US.campaign(newId).start))}`);
  </script>
</body>
</html>
