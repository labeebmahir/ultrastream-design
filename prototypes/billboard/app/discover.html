<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Discover feed – UltraStream prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/base.css">
  <link rel="stylesheet" href="../../../assets/css/app.css">
  <link rel="stylesheet" href="../css/billboard.css">
</head>
<body>
  <div class="stage">
    <main class="phone" aria-label="Discover feed">
      <header class="topbar">
        <img class="topbar__logo" src="../../../assets/img/logo-icon.png" alt="UltraStream">
        <div class="topbar__actions">
          <button class="icon-btn" type="button" aria-label="Notifications" data-todo>
            <i class="icon" data-lucide="bell-dot"></i>
          </button>
          <button class="icon-btn" type="button" aria-label="Search" data-todo>
            <i class="icon" data-lucide="search"></i>
          </button>
        </div>
      </header>
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
      <div class="feed" id="feed"></div>
      <nav class="tabbar" aria-label="Main">
        <button type="button" aria-current="page"><i class="icon" data-lucide="compass"></i>Discover</button>
        <button type="button" data-todo><i class="icon" data-lucide="user-round-search"></i>My Feed</button>
        <button type="button" data-todo><i class="icon" data-lucide="circle-plus"></i>Create</button>
        <button type="button" data-todo><i class="icon" data-lucide="video"></i>Shorts</button>
        <button type="button" data-todo><i class="icon" data-lucide="circle-user-round"></i>Profile</button>
      </nav>
    </main>

    <aside class="review" aria-label="Review notes">
      <h1>Discover feed</h1>
      <p id="review-time"></p>
      <div class="review__actions">
        <button class="btn btn--sm" type="button" id="jump-normal">Set to normal time (11:00)</button>
        <button class="btn btn--sm" type="button" id="jump-prime">Set to prime time (19:00)</button>
      </div>
      <h2>Showing now</h2>
      <div id="review-slots"></div>
      <button class="btn btn--sm" type="button" id="jump-banner">Scroll to next Standard Banner</button>
      <h2>Rules to check</h2>
      <ul>
        <li>Every ad has a “Sponsored” label.</li>
        <li>Ads appear in this feed only. Open any video to see that it has none, or <a href="watch.html?live=1">open a live stream</a>.</li>
        <li>Prime hours are a placeholder: 18:00–22:00.</li>
      </ul>
    </aside>
  </div>

  <script src="../../../assets/vendor/lucide.min.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/proto-bar.js"></script>
  <script src="../js/discover.js"></script>
</body>
</html>
