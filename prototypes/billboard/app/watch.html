<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../../../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../../../assets/img/apple-touch-icon.png">
  <title>Watch – UltraStream prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/base.css">
  <link rel="stylesheet" href="../../../assets/css/app.css">
  <link rel="stylesheet" href="../css/billboard.css">
</head>
<body>
  <div class="stage">
    <main class="phone" aria-label="Watch">
      <div class="player" id="player"></div>
      <a class="icon-btn icon-btn--boxed player__back" href="discover.html" aria-label="Back to Discover"><i class="icon" data-lucide="chevron-left"></i></a>
      <section class="watch">
        <div><h1 class="watch__title" id="title"></h1><p class="watch__meta" id="sub"></p></div>
        <div class="owner">
          <span class="avatar" id="avatar"></span>
          <span class="owner__text"><span class="owner__name" id="channel"></span><span id="handle"></span></span>
          <button data-todo class="btn btn--primary" type="button">Follow</button>
        </div>
        <div class="actions-row">
          <span class="pill-group"><button data-todo class="pill-btn" type="button" aria-label="Like, 12.5K"><i class="icon" data-lucide="thumbs-up"></i>12.5K</button><button data-todo class="pill-btn" type="button" aria-label="Dislike"><i class="icon" data-lucide="thumbs-down"></i></button></span>
          <button data-todo class="pill-btn" type="button" aria-label="Comments, 200"><i class="icon" data-lucide="message-circle"></i>200</button>
          <button data-todo class="pill-btn" type="button"><i class="icon" data-lucide="hand-coins"></i>Reward</button>
          <button data-todo class="pill-btn" type="button" aria-label="Share"><i class="icon" data-lucide="share"></i></button>
        </div>
        <div class="description">A sample description for this video. Real descriptions can run up to 250 characters. <a class="description__more" href="#" data-todo>See more...</a></div>
        <p class="note">Billboard rule: no ads on this screen. Ads appear only in the Discover feed, never during a video or live stream.</p>
      </section>
    </main>
  </div>

  <script src="../../../assets/vendor/lucide.min.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/proto-bar.js"></script>
  <script>US.renderWatch();</script>
</body>
</html>
