<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Watch – UltraStream prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/base.css">
  <link rel="stylesheet" href="../../../assets/css/app.css">
  <link rel="stylesheet" href="../css/billboard.css">
</head>
<body>
  <div class="stage">
    <main class="phone" aria-label="Watch">
      <header class="topbar">
        <a class="icon-btn" href="discover.html" aria-label="Back to Discover">
          <i class="icon" data-lucide="arrow-left"></i>
        </a>
      </header>
      <div class="player" id="player"></div>
      <section class="watch">
        <h1 class="watch__title" id="title"></h1>
        <div class="card__sub" id="sub"></div>
        <div class="owner">
          <span class="avatar" id="avatar"></span>
          <span class="owner__text"><span class="owner__name" id="channel"></span><span id="handle"></span><br>90k followers • 245 following</span>
          <button data-todo class="btn btn--primary" type="button">Follow</button>
        </div>
        <div class="actions-row">
          <button data-todo class="pill-btn pill-btn--on" type="button" aria-label="Like, 12.5k"><i class="icon" data-lucide="thumbs-up"></i>12.5k</button>
          <button data-todo class="pill-btn" type="button" aria-label="Dislike"><i class="icon" data-lucide="thumbs-down"></i></button>
          <button data-todo class="pill-btn" type="button" aria-label="Comments, 200"><i class="icon" data-lucide="message-circle"></i>200</button>
          <button data-todo class="pill-btn" type="button"><i class="icon" data-lucide="hand-coins"></i>Reward</button>
          <button data-todo class="pill-btn" type="button" aria-label="Share"><i class="icon" data-lucide="share"></i></button>
          <button data-todo class="pill-btn" type="button" aria-label="Report"><i class="icon" data-lucide="flag"></i></button>
        </div>
        <div class="description">A sample description for this video. Real descriptions can run up to 250 characters.</div>
        <p class="note">Billboard rule: no ads on this screen. Ads appear only in the Discover feed, never during a video or live stream.</p>
      </section>
    </main>
  </div>

  <script src="../../../assets/vendor/lucide.min.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/proto-bar.js"></script>
  <script>US.renderWatch();</script>
</body>
</html>
