<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../../../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../../../assets/img/apple-touch-icon.png">
  <title>Campaign – UltraStream admin prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/base.css">
  <link rel="stylesheet" href="../../../assets/css/admin.css">
  <link rel="stylesheet" href="../css/billboard.css">
</head>
<body class="admin-app">
  <div class="admin">
    <aside class="side" id="admin-nav" aria-label="Admin">
      <div class="side__brand"><span class="side__mark"><img src="../../../assets/img/logo-icon.png" alt=""></span><span><strong>UltraStream</strong><small>Admin</small></span></div>
      <nav class="side__nav">
        <a class="side__link" href="#" data-todo><i class="icon icon--sm" data-lucide="layout-dashboard"></i>Dashboard</a>
        <a class="side__link" href="#" data-todo><i class="icon icon--sm" data-lucide="users"></i>Users</a>
        <a class="side__link" href="#" data-todo><i class="icon icon--sm" data-lucide="flag"></i>Reports</a>
        <a class="side__link side__link--on" href="campaigns.html" aria-current="page"><i class="icon icon--sm" data-lucide="megaphone"></i>Ad campaigns<span class="side__new">New</span></a>
        <a class="side__link" href="#" data-todo><i class="icon icon--sm" data-lucide="smartphone"></i>App version</a>
      </nav>
      <div class="side__user">
        <strong>Sample admin</strong>
        <span>admin@example.com</span>
        <span class="side__role">Admin</span>
        <button class="side__logout" type="button" data-todo><i class="icon icon--sm" data-lucide="log-out"></i>Log out</button>
      </div>
    </aside>
    <div class="admin__body">
      <header class="admin-top">
        <button class="admin-top__menu" type="button" aria-label="Open menu" aria-controls="admin-nav" aria-expanded="false" data-menu><i class="icon" data-lucide="menu"></i></button>
        <span>Trust &amp; safety · Users &amp; reports</span>
      </header>
    <main class="main">
      <div id="content"></div>
    </main>
    </div>
  </div>

  <script src="../../../assets/vendor/lucide.min.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/proto-bar.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    US.setupNotBuilt();
    // Below 1024px the sidebar opens as a drawer.
    (function () {
      const shell = document.querySelector(".admin");
      const button = document.querySelector("[data-menu]");
      const setOpen = (open) => { shell.classList.toggle("admin--nav-open", open); button.setAttribute("aria-expanded", open); };
      button.addEventListener("click", () => setOpen(!shell.classList.contains("admin--nav-open")));
      shell.addEventListener("click", (e) => { if (e.target === shell) setOpen(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
    })();
  </script>
  <script>
    // One campaign, opened with View: details, payment record, pause log and the creative.
    (function () {
      const id = new URLSearchParams(location.search).get("id");
      const box = document.getElementById("content");

      const head = (title, sub, actions) => `<div class="head">
        <div class="head__title">
          <span class="head__mark"><img src="../../../assets/img/logo-icon.png" alt=""></span>
          <div><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}</div>
        </div>
        <div class="head__actions"><a class="btn" href="campaigns.html">Back to campaigns</a>${actions}</div>
      </div>`;
      const dl = (rows) => `<dl class="details">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`;

      function actionsFor(c, status) {
        if (status === "live") return `<button class="btn has-icon" type="button" data-pause="${c.id}"><i class="icon icon--sm" data-lucide="pause"></i>Pause campaign</button>`;
        if (status === "paused") return `<button class="btn btn--primary has-icon" type="button" data-resume="${c.id}"><i class="icon icon--sm" data-lucide="play"></i>Resume campaign</button>`;
        if (status === "ended") return `<a class="btn btn--primary has-icon" href="report.html?id=${c.id}"><i class="icon icon--sm" data-lucide="file-chart-column"></i>View report</a>`;
        return "";
      }

      function detailsHTML(c, status) {
        const t = US.AD_TYPES[c.type];
        const added = US.addedDays(c);
        const originalLast = US.fmtDate(US.addDays(US.originalEnd(c), -1));
        const dates = added
          ? `${US.period(c)}<span class="cell-sub">${added} paused day${added === 1 ? "" : "s"} added${status === "paused" ? " so far" : ""}. Originally ended ${originalLast}.</span>`
          : US.period(c);
        return `<section class="panel" id="details">
          <h2>Campaign</h2>
          ${dl([
            ["Status", US.statusBadge(status)],
            ["Package", US.esc(US.packageName(c))],
            ["Placement", US.esc(t.where)],
            ["Dates", dates],
            ["Link", `<a class="link-cell" href="${US.esc(c.url)}" target="_blank" rel="noopener">${US.esc(c.url.replace(/^https:\/\//, ""))}</a>`],
            ["Cost", `${US.fmtMoney(US.cost(c))}<span class="cell-sub">Placeholder price</span>`],
          ])}
        </section>`;
      }

      function paymentHTML(c) {
        const pay = c.payment || {};
        const rows = [["Confirmed by", pay.by], ["Date confirmed", pay.date && US.fmtDate(US.toDate(pay.date))], ["Method", pay.method], ["Reference", pay.ref]];
        return `<section class="panel" id="payment">
          <h2>Payment record <span class="tag tag--placeholder">Placeholder methods</span></h2>
          ${dl(rows.map(([k, v]) => [k, v ? US.esc(v) : "Not recorded"]))}
          <p class="panel__foot">Recorded when the campaign was created. The campaign was scheduled once this was filled in.</p>
        </section>`;
      }

      function pausesHTML(c, status) {
        const pauses = US.pausesOf(c);
        const added = US.addedDays(c);
        const open = pauses.find((p) => p.open);
        const intro = {
          scheduled: "A campaign can be paused once it's live.",
          live: "Pausing stops the ad showing in Discover. Paused days are added to the end date. There's no refund.",
          paused: open && `Not showing in Discover since ${US.fmtDateTime(open.from)}. Resume to show it again.`,
          ended: "",
        }[status];
        const rows = pauses.map((p) => `<tr${p.open ? ' class="is-paused"' : ""}>
            <td>${US.fmtDateTime(p.from)}</td>
            <td>${p.open ? "Still paused" : US.fmtDateTime(p.to)}</td>
            <td class="num">${US.fmtDuration(p.to - p.from)}</td>
          </tr>`).join("");
        const lastDay = US.fmtDate(US.addDays(US.originalEnd(c), -1));
        const total = `${added} day${added === 1 ? "" : "s"} added to the end date${status === "paused" ? " so far" : ""}. The last day moves from ${lastDay} to ${US.fmtDate(US.lastDay(c))}.`;
        return `<section class="panel" id="pauses">
          <h2>Pause log <span class="tag">${pauses.length}</span></h2>
          ${intro ? `<p class="panel__intro">${intro}</p>` : ""}
          ${pauses.length
            ? `<div class="data-table"><table>
                <thead><tr><th>From</th><th>To</th><th class="num">Length</th></tr></thead>
                <tbody>${rows}</tbody>
              </table></div>
              <p class="pause-total">${total}</p>`
            : `<p class="cell-sub">No pauses.</p>`}
        </section>`;
      }

      function creativeHTML(c) {
        return `<section class="panel" id="creative">
          <h2>Creative</h2>
          <div class="preview-phone preview-phone--panel">${US.adHTML(c, { preview: true })}</div>
          <p class="panel__foot">How the ad shows in Discover, with its "Sponsored" label. ${US.esc(US.AD_TYPES[c.type].spec)} (placeholder spec).</p>
        </section>`;
      }

      function render() {
        const c = US.campaign(id);
        if (!c) {
          box.innerHTML = head("Campaign", "", "") + `<div class="empty">This campaign wasn't found. Press Reset or go back to Campaigns.</div>`;
          return;
        }
        document.title = `${c.advertiser} – UltraStream admin prototype`;
        const status = US.status(c);
        box.innerHTML = head(US.esc(c.advertiser), `${US.statusBadge(status)} <span>${US.esc(US.packageName(c))}</span>`, actionsFor(c, status))
          + `<div class="detail-grid">
              <div>${detailsHTML(c, status)}${paymentHTML(c)}${pausesHTML(c, status)}</div>
              <div>${creativeHTML(c)}</div>
            </div>`;
      }

      render();
      document.addEventListener("us:change", render);
    })();
  </script>
</body>
</html>
