<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
  <title>Questions – Billboard prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/answers.css">
  <link rel="stylesheet" href="css/billboard.css">
</head>
<body>
  <main class="ask" id="ask"></main>

  <script src="../../assets/vendor/lucide.min.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/answers.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/proto-bar.js"></script>
  <script>
    // "current" is the position of the option the prototype uses now, or null if it doesn't apply.
    // version 5: the list changed, so answers saved against the earlier list aren't carried over. Matches proto-bar.js.
    US.setupAnswers({
      root: document.getElementById("ask"),
      feature: "billboard",
      featureName: "Billboard",
      version: 5,
      questions: [
        {
          "title": "Taking down a live ad",
          "ask": "Admin can pause a live campaign. Is pausing enough to take down an ad that breaks the rules, or does admin also need a remove action?",
          "current": 0,
          "options": [
            "Pausing is enough",
            "Admin also needs a remove action",
            "The dev team removes it on request"
          ]
        },
        {
          "title": "End early and swap creative",
          "ask": "Are \"end early\" and \"swap creative\" needed in the first release?",
          "current": 0,
          "options": [
            "Neither, pausing is enough for now",
            "End early only",
            "Swap creative only",
            "Both"
          ]
        },
        {
          "title": "Make-good",
          "ask": "What is a make-good after a pause?",
          "current": 0,
          "options": [
            "Paused days added to the end date",
            "The missed airtime booked at another free time",
            "A credit for the missed airtime"
          ]
        },
        {
          "title": "Payment",
          "ask": "How do brands pay, and who confirms that a payment has arrived?",
          "current": null,
          "options": [
            "Bank transfer, confirmed by sales",
            "Bank transfer, confirmed by finance",
            "Bank transfer or card, confirmed by finance"
          ]
        },
        {
          "title": "Changing a scheduled campaign",
          "ask": "Once a campaign is scheduled, can admin still change it before its start date, for example if the brand pulls out?",
          "current": 0,
          "options": [
            "No, it can't be changed",
            "Yes, it can be edited",
            "Yes, it can be edited or deleted"
          ]
        },
        {
          "title": "Prime time window",
          "ask": "Prime time is one 4-hour window, the same moment for every viewer. Which window should it be, in UTC?",
          "current": 0,
          "options": [
            "13:00–17:00 UTC",
            "12:00–16:00 UTC",
            "14:00–18:00 UTC"
          ]
        },
        {
          "title": "Time zone for bookings",
          "ask": "Which time zone do campaign dates and daily windows use?",
          "current": 0,
          "options": [
            "UTC",
            "The sales team's local time",
            "The advertiser's local time"
          ]
        },
        {
          "title": "Windows that cross prime time",
          "ask": "A Billboard window sits outside prime time and a Billboard Prime Time window inside it. What happens when a window runs across both?",
          "current": 0,
          "options": [
            "It's blocked, with a quick fix to the part that fits",
            "It's split into two lines, each at its own rate"
          ]
        },
        {
          "title": "Minimum booking length",
          "ask": "What is the shortest daily window a brand can book?",
          "current": 0,
          "options": [
            "15 minutes",
            "30 minutes",
            "1 hour"
          ]
        },
        {
          "title": "Choosing a window",
          "ask": "How are booking windows chosen?",
          "current": 1,
          "options": [
            "Any start and end time",
            "15-minute steps",
            "Whole hours"
          ]
        },
        {
          "title": "Price per minute or per thousand views",
          "ask": "Brands usually compare ad prices per thousand views (CPM). Should we quote per minute of airtime only, also show the equivalent CPM, or sell per thousand views instead?",
          "current": 1,
          "options": [
            "Per minute of airtime only",
            "Per minute, also showing the equivalent CPM",
            "Per thousand views instead"
          ]
        },
        {
          "title": "Empty slots",
          "ask": "If no Billboard or Billboard Prime Time is on air at that minute, what happens to the Featured Banner?",
          "current": 0,
          "options": [
            "It moves to the top",
            "It stays in its usual place",
            "It doesn't show"
          ]
        },
        {
          "title": "Category filters",
          "ask": "Do ads stay on filtered Discover views?",
          "current": 0,
          "options": [
            "Yes, all of them",
            "Only Standard Banners",
            "No, the main feed only"
          ]
        },
        {
          "title": "Counting posts",
          "ask": "The brief says \"about every 15 posts\". What counts as a post?",
          "current": 0,
          "options": [
            "Videos and shorts",
            "Videos only"
          ]
        },
        {
          "title": "Creative format",
          "ask": "What can a creative be, and where does a click open?",
          "current": 0,
          "options": [
            "Images, opening an external browser",
            "Images, opening an in-app browser",
            "Images or video, opening an external browser",
            "Images or video, opening an in-app browser"
          ]
        },
        {
          "title": "Choosing countries",
          "ask": "Can brands choose which countries their ad shows in, or do they only see countries in the report?",
          "current": 1,
          "options": [
            "Brands choose countries when they book",
            "Countries only appear in the report"
          ]
        },
        {
          "title": "Measuring",
          "ask": "What should count as an impression?",
          "current": null,
          "options": [
            "Every time an ad is shown",
            "Once per viewer per day",
            "Report both"
          ]
        },
        {
          "title": "Cost on the report",
          "ask": "Which cost should the report show?",
          "current": 0,
          "options": [
            "The list price",
            "The invoiced price, if sales gives a discount",
            "No cost on the report"
          ]
        },
        {
          "title": "Where enquiries go",
          "ask": "Where should enquiries from the advertise page go?",
          "current": null,
          "options": [
            "A sales email",
            "A list in the admin panel",
            "Both"
          ]
        },
        {
          "title": "Enquiry owner and reply time",
          "ask": "Who owns each enquiry, and how quickly does the team reply?",
          "current": null,
          "options": [
            "Sales, within one working day",
            "Sales, within two working days",
            "Marketing, within one working day"
          ]
        },
        {
          "title": "Rate card or media kit",
          "ask": "Should the enquiry page link to a rate card or media kit?",
          "current": 0,
          "options": [
            "No, sales sends it after an enquiry",
            "Link a media kit, without prices",
            "Link a rate card, with prices"
          ]
        },
        {
          "title": "\"Become an Advertiser\" on Profile",
          "ask": "What should happen to \"Become an Advertiser\" on the Profile tab?",
          "current": null,
          "options": [
            "Remove it",
            "Link it to /advertise",
            "Leave it as coming soon"
          ]
        }
      ],
    });
  </script>
</body>
</html>
