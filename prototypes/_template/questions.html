<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
  <title>Questions – UltraStream prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/answers.css">
  <link rel="stylesheet" href="css/prototype.css">
</head>
<body>
  <main class="ask" id="ask"></main>

  <script src="../../assets/vendor/lucide.min.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/answers.js"></script>
  <script src="js/prototype-bar.js"></script>
  <script>
    // "current" is the position of the option the prototype uses now, or null if it doesn't apply.
    US.setupAnswers({
      root: document.getElementById("ask"),
      feature: "FEATURE-NAME",
      featureName: "Feature name",
      questions: [
        {
          "title": "Short name",
          "ask": "The question, in neutral wording?",
          "current": 0,
          "options": [
            "What the prototype does now",
            "Another sensible answer"
          ]
        }
      ],
    });
  </script>
</body>
</html>
