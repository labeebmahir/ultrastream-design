<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <title>Rebuilt app – UltraStream design</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/site-header.css">
  <link rel="stylesheet" href="../assets/css/screen-browser.css">
</head>
<body>
  <header data-site-header data-root="../" data-current="app"></header>

  <main class="sb">
    <h1 class="sb__title">Rebuilt app</h1>
    <p class="sb__lede" id="lede">Every screen of the current app, rebuilt from the live app's code.</p>

    <div class="sb__tools">
      <label class="sb__search">
        <i class="icon icon--sm" data-lucide="search"></i>
        <input id="q" type="search" placeholder="Find a screen or state" autocomplete="off" aria-label="Find a screen or state">
        <kbd>/</kbd>
      </label>
      <div class="sb__areas" id="areas" role="group" aria-label="Show an area"></div>
    </div>

    <div id="sections"></div>
    <p class="sb__none" id="none" hidden>No screens match. Try a name like "wallet" or a state like "offline".</p>
  </main>

  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/activity-log.js"></script>
  <script src="../assets/js/site-header.js"></script>
  <script src="../assets/js/screen-browser.js"></script>
</body>
</html>
