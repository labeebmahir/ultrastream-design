<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <title>Forgot password – UltraStream design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="css/onboarding.css">
</head>
<body data-screen="forgot">
  <div class="stage">
    <main class="phone auth" aria-label="Forgot password">
      <div class="auth__scroll">

        <!-- Step 1: email -->
        <div class="auth__content auth__content--wide" data-step="1">
          <header class="auth-hero">
            <h1 class="auth-title">Forgot password?</h1>
            <p class="auth-sub">Enter your email address. We will send a 6-digit code to your email.</p>
          </header>
          <form class="auth-form" id="step1" novalidate>
            <label class="field">
              <span class="field__label">Email</span>
              <input class="input" id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com">
              <span class="field__error" hidden></span>
            </label>
            <button class="btn btn--primary btn--lg" id="send" type="submit">Continue</button>
          </form>
          <button class="back-link" type="button" data-back><i class="icon" data-lucide="arrow-left"></i>Go back</button>
        </div>

        <!-- Step 2: emailed code -->
        <div class="auth__content auth__content--wide" data-step="2" hidden>
          <header class="auth-hero">
            <h1 class="auth-title auth-title--sm">Check your email</h1>
            <p class="auth-sub">We sent a 6-digit code to <strong id="sent-to"></strong>. Enter it below.</p>
          </header>
          <form class="auth-form" id="step2" novalidate>
            <div class="otp" id="otp">
              <div class="otp__boxes" role="group" aria-label="6-digit code">
                <input class="otp__box" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Digit 1">
                <input class="otp__box" inputmode="numeric" maxlength="6" aria-label="Digit 2">
                <input class="otp__box" inputmode="numeric" maxlength="6" aria-label="Digit 3">
                <input class="otp__box" inputmode="numeric" maxlength="6" aria-label="Digit 4">
                <input class="otp__box" inputmode="numeric" maxlength="6" aria-label="Digit 5">
                <input class="otp__box" inputmode="numeric" maxlength="6" aria-label="Digit 6">
              </div>
              <p class="otp__error" role="alert" hidden></p>
            </div>
            <p class="auth-footer">Didn't receive it?&nbsp;<button class="text-link text-link--orange" type="button" id="resend">Resend in 59s</button></p>
            <button class="btn btn--primary btn--lg" id="verify" type="submit">Verify email</button>
          </form>
          <p class="auth-footer auth-footer--top">Wrong email?&nbsp;<button class="text-link text-link--bold" type="button" id="change-email">Change it</button></p>
        </div>

        <!-- Step 3: new password -->
        <div class="auth__content auth__content--wide" data-step="3" hidden>
          <header class="auth-hero">
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-sub">Create a strong new password.</p>
          </header>
          <form class="auth-form" id="step3" novalidate>
            <label class="field">
              <span class="field__label">Password</span>
              <span class="input-wrap">
                <input class="input" id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
                <button class="icon-btn input-wrap__btn" type="button" data-toggle-password aria-label="Show password"><i class="icon" data-lucide="eye"></i></button>
              </span>
              <span class="field__error" hidden></span>
            </label>
            <label class="field">
              <span class="field__label">Confirm password</span>
              <span class="input-wrap">
                <input class="input" id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter your password">
                <button class="icon-btn input-wrap__btn" type="button" data-toggle-password aria-label="Show password"><i class="icon" data-lucide="eye"></i></button>
              </span>
              <span class="field__error" hidden></span>
            </label>
            <button class="btn btn--primary btn--lg" id="reset" type="submit">Continue</button>
          </form>
        </div>

      </div>
      <!-- On the new password step, Go back sits at the bottom of the screen, outside the scroll -->
      <button class="back-link back-link--bottom" type="button" id="back-bottom" data-back hidden><i class="icon" data-lucide="arrow-left"></i>Go back</button>
    </main>
  </div>

  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="js/onboarding.js"></script>
</body>
</html>
