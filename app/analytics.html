<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <title>Analysis – UltraStream design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body data-page="analysis">
  <!-- Analysis. States: default (last 7 days), period-menu, 30d, 90d. -->
  <div class="stage">
    <main class="phone" aria-label="Analysis">
      <header class="app-header studio-header an-header">
        <a class="icon-btn" href="ultra-studio.html" data-back aria-label="Back"><i class="icon" data-lucide="arrow-left"></i></a>
        <h1 class="app-header__title studio-title">Analysis</h1>
        <div class="an-period">
          <button class="an-period__btn" type="button" id="period" aria-haspopup="menu" aria-expanded="false" aria-controls="period-menu"><span id="period-label">Last 7 days</span><span id="chev-down"><i class="icon" data-lucide="chevron-down"></i></span><span id="chev-up" hidden><i class="icon" data-lucide="chevron-up"></i></span></button>
          <div class="an-period__menu" id="period-menu" role="menu" hidden>
            <button type="button" role="menuitemradio" aria-checked="true" data-period="7d">Last 7 days</button>
            <button type="button" role="menuitemradio" aria-checked="false" data-period="30d">Last 30 days</button>
            <button type="button" role="menuitemradio" aria-checked="false" data-period="90d">Last 90 days</button>
          </div>
        </div>
      </header>
      <div class="studio-scroll"><div class="an-body" id="charts"></div></div>
    </main>
  </div>

  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="js/studio.js"></script>
</body>
</html>
