<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <title>Watch – UltraStream design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="css/watch.css">
</head>
<body class="watch-page">
  <div class="stage">
    <main class="phone" aria-label="Watch">
      <div class="player" id="player"></div>
      <a class="icon-btn icon-btn--boxed player__back" href="discover.html" aria-label="Back to Discover"><i class="icon" data-lucide="chevron-left"></i></a>
      <div class="watch-body" id="watch-body">
        <section class="watch">
          <div><h1 class="watch__title" id="title"></h1><p class="watch__meta" id="sub"></p></div>
          <div class="owner">
            <a class="owner__profile" id="owner-link" href="channel.html">
              <span class="avatar" id="avatar"></span>
              <span class="owner__text"><span class="owner__name" id="channel"></span><span id="handle"></span></span>
            </a>
            <button class="btn btn--primary" type="button" id="follow">Follow</button>
          </div>
          <div class="actions-row" id="actions">
            <span class="pill-group" id="rate"><button class="pill-btn" type="button" id="like" aria-pressed="false" aria-label="Like, 12.5K"><i class="icon" data-lucide="thumbs-up"></i><span id="like-count">12.5K</span></button><button class="pill-btn pill-btn--icon" type="button" id="dislike" aria-pressed="false" aria-label="Dislike"><i class="icon" data-lucide="thumbs-down"></i></button></span>
            <button class="pill-btn" type="button" id="comments-btn" aria-label="Comments, 4"><i class="icon" data-lucide="message-circle"></i><span id="comment-count">4</span></button>
            <button class="pill-btn pill-btn--reward" type="button" id="reward-btn"><i class="icon" data-lucide="hand-coins"></i>Reward</button>
            <button class="pill-btn pill-btn--share" type="button" id="share-btn" aria-label="Share"><i class="icon" data-lucide="share"></i></button>
          </div>
          <div class="description" id="description"></div>
          <h2 class="section-title">Related Videos</h2>
          <div class="related" id="related"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="js/watch.js"></script>
</body>
</html>
