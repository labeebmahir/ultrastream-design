<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Watch – UltraStream prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <div class="stage">
    <main class="phone" aria-label="Watch">
      <header class="topbar">
        <a class="icon-btn" href="discover.html" aria-label="Back to Discover">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 19 5 12l7-7M5 12h14"/></svg>
        </a>
      </header>
      <div class="player" id="player"></div>
      <section class="watch">
        <h1 class="watch__title" id="title"></h1>
        <div class="card__sub" id="sub"></div>
        <div class="owner">
          <span class="avatar" id="avatar"></span>
          <span class="owner__text"><span class="owner__name" id="channel"></span><span id="handle"></span><br>90k followers • 245 following</span>
          <button class="btn btn--primary" type="button">Follow</button>
        </div>
        <div class="actions-row">
          <button class="pill-btn pill-btn--on" type="button" aria-label="Like, 12.5k"><svg class="icon" viewBox="0 0 24 24"><path d="M7 10v12M15 5.900 14 10h5.800a2 2 0 0 1 1.900 2.600l-2.300 8a2 2 0 0 1-2 1.400H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.800a2 2 0 0 0 1.800-1.100L12 2a3 3 0 0 1 3 3.900"/></svg>12.5k</button>
          <button class="pill-btn" type="button" aria-label="Dislike"><svg class="icon" viewBox="0 0 24 24"><path d="M17 14V2M9 18.100 10 14H4.200a2 2 0 0 1-1.900-2.600l2.300-8A2 2 0 0 1 6.600 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.800a2 2 0 0 0-1.800 1.100L12 22a3 3 0 0 1-3-3.900"/></svg></button>
          <button class="pill-btn" type="button" aria-label="Comments, 200"><svg class="icon" viewBox="0 0 24 24"><path d="M7.900 20A9 9 0 1 0 4 16.100L2 22z"/></svg>200</button>
          <button class="pill-btn" type="button">Reward</button>
          <button class="pill-btn" type="button" aria-label="Share"><svg class="icon" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></button>
          <button class="pill-btn" type="button" aria-label="Report"><svg class="icon" viewBox="0 0 24 24"><path d="M4 22V4s1-1 4-1 5 2 8 2 4-1 4-1v11s-1 1-4 1-5-2-8-2-4 1-4 1"/></svg></button>
        </div>
        <div class="description">Placeholder description for this prototype.</div>
        <p class="note">Billboard rule: no ads on this screen. Ads appear only in the Discover feed, never during a video or live stream.</p>
      </section>
    </main>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/proto-bar.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const live = params.has("live");
    const item = US.CONTENT.find((c) => c.id === params.get("id")) || US.CONTENT[0];
    const player = document.getElementById("player");
    player.style.background = `linear-gradient(135deg,hsl(${item.hue} 55% 32%),hsl(${(item.hue + 50) % 360} 65% 18%))`;
    if (live) player.innerHTML = '<span class="thumb-pill thumb-pill--left">Live</span><span class="thumb-pill thumb-pill--right">12.5k</span>';
    document.getElementById("title").textContent = item.title;
    document.getElementById("sub").textContent = live ? "Live now" : `${item.views} views • ${item.age}`;
    document.getElementById("channel").textContent = item.channel;
    document.getElementById("handle").textContent = "@" + item.channel.toLowerCase();
    const avatar = document.getElementById("avatar");
    avatar.textContent = item.channel[0];
    avatar.style.background = `hsl(${item.hue} 70% 70%)`;
  </script>
</body>
</html>
