<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <title>Log in – UltraStream design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="css/onboarding.css">
</head>
<body data-screen="signIn">
  <div class="stage">
    <main class="phone auth" aria-label="Log in">
      <div class="auth__scroll">
        <div class="auth__content">
          <header class="auth-hero auth-hero--spaced">
            <h1 class="auth-title">Log in to your account</h1>
            <p class="auth-sub auth-sub--sm">Start with your email address.</p>
          </header>

          <form class="auth-form auth-form--top" id="form" novalidate>
            <label class="field">
              <span class="field__label">Email</span>
              <input class="input" id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com">
              <span class="field__error" hidden></span>
            </label>

            <label class="field">
              <span class="field__label">Password</span>
              <span class="input-wrap">
                <input class="input" id="password" type="password" autocomplete="current-password" placeholder="Enter your password">
                <button class="icon-btn input-wrap__btn" type="button" data-toggle-password aria-label="Show password"><i class="icon" data-lucide="eye"></i></button>
              </span>
              <span class="field__error" hidden></span>
            </label>

            <div class="auth-options">
              <label class="check"><input type="checkbox" id="remember">Remember me</label>
              <a class="text-link" href="forgot-password.html">Forgot Password?</a>
            </div>

            <button class="btn btn--primary" id="submit" type="submit">Continue</button>

            <div class="auth-divider">or continue with</div>

            <div class="auth-stack">
              <button class="btn btn--social" type="button" data-social="google"><span class="social-g" aria-hidden="true">G</span>Continue with Google</button>
              <button class="btn btn--social" type="button" data-social="apple" data-apple><i class="icon" data-lucide="apple"></i>Continue with Apple</button>
            </div>

            <p class="auth-footer">Don't have account?&nbsp;<a class="text-link text-link--bold" href="sign-up.html">Sign up</a></p>

            <a class="back-link back-link--lg back-link--end" href="welcome.html"><i class="icon" data-lucide="arrow-left"></i>Go back</a>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="js/onboarding.js"></script>
</body>
</html>
