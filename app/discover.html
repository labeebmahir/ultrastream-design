<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Discover feed – UltraStream prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <div class="stage">
    <main class="phone" aria-label="Discover feed">
      <header class="topbar">
        <img class="topbar__logo" src="../assets/img/logo-icon.png" alt="UltraStream">
        <div class="topbar__actions">
          <button class="icon-btn" type="button" aria-label="Notifications" data-todo>
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 8-5.6M18 11c0 5 2 6.500 2 6.500H4s2-1.500 2-6.500"/><path d="M10.300 21a2 2 0 0 0 3.400 0"/><circle cx="17.500" cy="6" r="2.500"/></svg>
          </button>
          <button class="icon-btn" type="button" aria-label="Search" data-todo>
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.300-4.300"/></svg>
          </button>
        </div>
      </header>
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
      <div class="feed" id="feed"></div>
      <nav class="tabbar" aria-label="Main">
        <button type="button" aria-current="page"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16.200 7.800-2.100 6.300-6.300 2.100 2.100-6.300z"/></svg>Discover</button>
        <button type="button" data-todo><svg class="icon" viewBox="0 0 24 24"><circle cx="10" cy="8" r="5"/><path d="M2 21a8 8 0 0 1 10.400-7.600"/><circle cx="18" cy="18" r="3"/><path d="m22 22-1.900-1.900"/></svg>My Feed</button>
        <button type="button" data-todo><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>Create</button>
        <button type="button" data-todo><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/></svg>Shorts</button>
        <button type="button" data-todo><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.700a5 5 0 0 1 10 0"/></svg>Profile</button>
      </nav>
    </main>

    <aside class="review" aria-label="Review notes">
      <h1>Discover feed</h1>
      <p id="review-time"></p>
      <div class="review__actions">
        <button class="btn btn--sm" type="button" id="jump-normal">Set to normal time (11:00)</button>
        <button class="btn btn--sm" type="button" id="jump-prime">Set to prime time (19:00)</button>
      </div>
      <h2>Showing now</h2>
      <div id="review-slots"></div>
      <button class="btn btn--sm" type="button" id="jump-banner">Scroll to next Standard Banner</button>
      <h2>Rules to check</h2>
      <ul>
        <li>Every ad has a “Sponsored” label.</li>
        <li>Ads appear in this feed only. Open any video to see that it has none, or <a href="watch.html?live=1">open a live stream</a>.</li>
        <li>Prime hours are a placeholder: 18:00–22:00.</li>
      </ul>
    </aside>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/proto-bar.js"></script>
  <script src="../assets/js/discover.js"></script>
</body>
</html>
