<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <title>Change password – UltraStream design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<!-- ?state= errors | too-short | mismatch | same | success. Passwords are never sent or stored. -->
<body data-screen="change-password">
  <div class="stage">
    <main class="phone" aria-label="Change password">
      <header class="app-header pr-header">
        <a class="icon-btn" href="settings.html" data-keep-as aria-label="Back to Settings"><i class="icon" data-lucide="arrow-left"></i></a>
        <h1 class="app-header__title">Change Password</h1>
      </header>
      <form class="screen-body pr-form" id="password-form" novalidate>
        <p class="pr-intro">Enter your current password and choose a new one. You will be signed out after updating your password.</p>

        <div class="pr-field pr-field--tight">
          <label class="pr-field__label" for="current">Current password</label>
          <div class="pr-input-wrap">
            <input class="input pr-input" id="current" type="password" autocomplete="off" placeholder="Enter current password" aria-describedby="current-msg">
            <button class="icon-btn" type="button" data-reveal="current" aria-label="Show password"><i class="icon" data-lucide="eye"></i></button>
          </div>
          <p class="pr-helper" id="current-msg" hidden></p>
        </div>

        <div class="pr-field pr-field--tight">
          <label class="pr-field__label" for="new">New password</label>
          <div class="pr-input-wrap">
            <input class="input pr-input" id="new" type="password" autocomplete="off" placeholder="Enter new password" aria-describedby="new-msg">
            <button class="icon-btn" type="button" data-reveal="new" aria-label="Show password"><i class="icon" data-lucide="eye"></i></button>
          </div>
          <p class="pr-helper" id="new-msg">Minimum 8 characters</p>
        </div>

        <div class="pr-field pr-field--tight">
          <label class="pr-field__label" for="confirm">Confirm new password</label>
          <div class="pr-input-wrap">
            <input class="input pr-input" id="confirm" type="password" autocomplete="off" placeholder="Re-enter new password" aria-describedby="confirm-msg">
            <button class="icon-btn" type="button" data-reveal="confirm" aria-label="Show password"><i class="icon" data-lucide="eye"></i></button>
          </div>
          <p class="pr-helper" id="confirm-msg" hidden></p>
        </div>

        <button class="btn btn--primary btn--block" type="submit" id="update">Update Password</button>
      </form>
    </main>
  </div>

  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
