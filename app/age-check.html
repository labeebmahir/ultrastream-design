<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <title>Age check – UltraStream design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="css/onboarding.css">
</head>
<body data-screen="ageCheck">
  <div class="stage">
    <!-- Built from the design file: the app's code has no age check screen yet. No camera is used. -->
    <main class="phone auth" aria-label="Age check">
      <div class="age">
        <h1 class="auth-title">Confirm you are 18+</h1>
        <p class="auth-sub">Take a quick live selfie so we can confirm you're 18 or older. Your estimated age is never saved, only a yes/no result.</p>
        <div class="age__oval" id="oval" aria-hidden="true"></div>
        <p class="age__hint" id="hint" role="status">Center your face in the oval</p>
        <div class="age__action"><button class="btn btn--primary btn--block" id="selfie" type="button">Take Selfie</button></div>
      </div>
    </main>
  </div>

  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="js/onboarding.js"></script>
</body>
</html>
