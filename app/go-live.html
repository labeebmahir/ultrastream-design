<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <title>Go Live – UltraStream design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body data-page="live">
  <!-- Start a live stream. States: default, filled, tips-off, category. -->
  <div class="stage">
    <main class="phone" aria-label="Go Live">
      <div class="live-scroll">
        <div class="live-header">
          <a class="icon-btn" href="ultra-studio.html" data-back aria-label="Close"><i class="icon" data-lucide="x"></i></a>
          <h1 class="studio-title studio-title--lg">Go Live</h1>
          <span class="live-header__spacer"></span>
        </div>
        <div class="live-thumb"><i class="icon" data-lucide="camera"></i>Add Thumbnail</div>
        <div class="s-field">
          <label class="s-label" for="stream-title">Stream Title</label>
          <div class="s-input-icon"><i class="icon" data-lucide="pencil"></i><input class="s-input" id="stream-title" type="text" placeholder="What's your stream about?" autocomplete="off"></div>
        </div>
        <div class="s-field">
          <span class="s-label" id="category-label">Category</span>
          <button class="s-select" type="button" id="category" aria-haspopup="listbox" aria-labelledby="category-label category"><span class="s-select__value"></span><i class="icon" data-lucide="chevron-down"></i></button>
        </div>
        <div class="live-setting">
          <div>
            <div class="live-setting__label" id="tips-label">Enable Tips</div>
            <div class="live-setting__hint" id="tips-hint">Allow viewers to send coins during stream</div>
          </div>
          <button class="switch switch--light" type="button" role="switch" aria-checked="true" aria-labelledby="tips-label" aria-describedby="tips-hint" id="tips"></button>
        </div>
        <button class="btn btn--primary btn--lg btn--block btn--pill" type="button" id="go"><i class="icon" data-lucide="radio"></i>Go Live</button>
      </div>
    </main>
  </div>

  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="js/studio.js"></script>
</body>
</html>
